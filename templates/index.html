<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페24 썸네일 1000x1400 단계별 변환 및 송신 시스템</title>
    <!-- Tailwind CSS (디자인용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 헤더 -->
        <header class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-900">🖼️ 카페24 썸네일 일괄 변환 및 검수/송신 시스템</h1>
                <p class="text-sm text-slate-500 mt-1">1000x1000px 썸네일을 1000x1400px로 미리 변환하여 검수 후 카페24로 전송합니다.</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-xs font-mono bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full border border-indigo-100">
                    Target: 1000x1400 px (JPG/PNG/GIF)
                </div>
                <button id="reauthBtn" onclick="openCafe24Reauth()" class="text-xs font-semibold bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full border border-amber-200 transition-colors flex items-center gap-1">
                    🔐 카페24 어드민 연동/재인증하기
                </button>
            </div>
        </header>

        <!-- 1. 상품 검색 영역 -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">1. 상품 검색</h2>
            <div class="flex gap-3">
                <select id="searchType" class="px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="model_name">모델명 검색</option>
                    <option value="product_name">상품명 검색</option>
                    <option value="product_code">상품코드 검색</option>
                </select>
                <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: JK-2026)" onkeydown="handleSearchInputKeydown(event)" class="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="searchBtn" onclick="searchProducts()" class="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-lg transition-colors flex items-center gap-2">
                    🔍 상품 읽어오기
                </button>
            </div>
        </section>

        <!-- 2. 컨트롤 영역 (1단계: 변환실행 / 2단계: 카페24로 송신) -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 text-sm font-medium cursor-pointer">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                        전체 선택
                    </label>
                    <div class="h-4 w-px bg-slate-200"></div>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-medium text-slate-600">가공 모드:</span>
                        <select id="processMode" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-semibold bg-indigo-50 text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="product">제품컷 (상하 여백 채우기)</option>
                            <option value="model">모델컷 (확대 및 가로 크롭)</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- 카페24는 100건씩만 주므로 내부적으로 offset을 옮겨가며 전부 조회한다.
                         아래는 그 순회를 어디까지 할지 정하는 상한값이다. -->
                    <select id="maxScan" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none" title="검색 결과를 어디까지 조회할지 상한">
                        <option value="all" selected>전체 조회</option>
                        <option value="100">최대 100건</option>
                        <option value="300">최대 300건</option>
                        <option value="1000">최대 1000건</option>
                    </select>

                    <select id="sortOrder" onchange="searchProducts()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                        <option value="asc" selected>등록순</option>
                        <option value="desc">등록역순</option>
                    </select>

                    <!-- [1단계] 변환실행 버튼 -->
                    <button id="convertBtn" onclick="runConvert()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm rounded-lg transition-all shadow-sm flex items-center gap-2">
                        <span>🎨</span> <span>1단계: 변환실행</span>
                    </button>

                    <!-- 변환 결과 다운로드 버튼 (선택된 상품 전체) -->
                    <button id="downloadBtn" onclick="downloadSelected()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-lg transition-all shadow-sm flex items-center gap-2">
                        <span>⬇️</span> <span>다운로드</span>
                    </button>

                    <!-- [2단계] 카페24 송신 버튼 -->
                    <button id="sendBtn" onclick="runSendToCafe24()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-lg transition-all shadow-sm flex items-center gap-2">
                        <span>🚀</span> <span>2단계: 카페24로 송신</span>
                    </button>
                </div>
            </div>

            <!-- 진행 상태 및 진행률 바 (Progress Bar) -->
            <div id="progressArea" class="hidden pt-3 border-t border-slate-100 space-y-2">
                <div class="flex justify-between items-center text-xs font-semibold">
                    <span id="stepStatus" class="text-indigo-600">작업 진행 중...</span>
                    <span id="progressPercent" class="text-slate-500">0 / 0 (0%)</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- 3. 상품 목록 표 (변환 전 vs 변환 후 이미지 리스트 표시) -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- 조회 결과 요약 (총 상품수) -->
            <div class="px-5 py-3 border-b border-slate-200 bg-slate-50/70 flex flex-wrap items-center gap-x-3 gap-y-1">
                <span class="text-sm font-bold text-slate-800">총 상품수: <span id="totalCount">0</span>건</span>
                <span id="filterNote" class="text-xs text-slate-500"></span>
            </div>
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-100 text-slate-700 font-semibold border-b border-slate-200">
                    <tr>
                        <th class="p-4 w-12 text-center">선택</th>
                        <th class="p-4 w-14 text-center">No.</th>
                        <th class="p-4 w-56">상품명 / 상품코드</th>
                        <th class="p-4">이미지 (원본 → 변환 후) · 체크된 것만 변환/송신</th>
                        <th class="p-4 w-32 text-center">진행 단계</th>
                        <th class="p-4 w-24 text-center">다운로드</th>
                    </tr>
                </thead>
                <tbody id="productTableBody" class="divide-y divide-slate-100">
                    <!-- 행은 renderProductTable()에 의해 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </section>

        <!-- 4. 실패 상품 리스트 (실패 시에만 노출) -->
        <section id="failureArea" class="hidden bg-red-50 p-5 rounded-xl border border-red-200 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-red-700 flex items-center gap-2">
                    ⚠️ 카페24 송신 실패 상품 목록 (<span id="failCount">0</span>건)
                </h3>
                <button onclick="retryFailed()" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg transition-colors">
                    🔄 실패 상품만 재송신
                </button>
            </div>
            <div class="bg-white rounded-lg border border-red-100 overflow-hidden">
                <table class="w-full text-left text-xs">
                    <thead class="bg-red-100/50 text-red-800 font-semibold">
                        <tr>
                            <th class="p-3 w-10 text-center"><input type="checkbox" checked></th>
                            <th class="p-3 w-28">상품코드</th>
                            <th class="p-3">상품명</th>
                            <th class="p-3">실패 사유</th>
                        </tr>
                    </thead>
                    <tbody id="failTableBody" class="divide-y divide-red-50 text-slate-700">
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        // ==========================================
        // 상태(state)
        // ==========================================
        // 상품 1건의 데이터 구조:
        // {
        //   product_no, product_code, product_name,
        //   image_url,      // 원본(1:1) 이미지 URL - /api/convert 호출 시 서버가 다운로드하는 소스
        //   filename,       // 원본 파일명(확장자 포함, GIF 포함)
        //   format,         // 'JPG' | 'PNG' | 'GIF' 등 표시용
        //   add_images,     // 추가이미지 원본 URL 목록 (buildImageList로 images에 합쳐짐)
        //   images,         // 대표+추가 이미지 목록. 각 항목:
        //                   //   { key: 'main'|'add_0'..., label: '대표'|'추가1'...,
        //                   //     source_url, checked, preview_url, processed_filename, convert_error }
        //                   //   checked=false인 이미지는 변환/송신/다운로드에서 모두 제외된다
        //   status          // 화면 "진행 단계" 컬럼에 표시할 텍스트
        // }
        let productsData = [];

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.product-check').forEach(cb => cb.checked = isChecked);
        }

        // GET /api/auth/reauth-url 조회 후 카페24 로그인/권한 승인 페이지를 새 창으로 오픈
        async function openCafe24Reauth() {
            try {
                const res = await fetch('/api/auth/reauth-url');
                const json = await res.json();

                if (!res.ok || !json.success || !json.reauth_url) {
                    alert(json.error || '카페24 재인증 URL을 생성할 수 없습니다.');
                    return;
                }

                window.open(json.reauth_url, '_blank', 'noopener,noreferrer');
            } catch (e) {
                alert(`재인증 URL 조회 중 오류가 발생했습니다: ${e.message}`);
            }
        }

        // 검색어 입력창에서 Enter 입력 시 버튼 클릭과 동일하게 검색 실행
        function handleSearchInputKeydown(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                searchProducts();
            }
        }

        // 한 요청에서 처리할 건수. 상품마다 원본 이미지를 열어 비율을 확인하므로
        // 100건씩 처리하면 서버 응답이 Render 요청 타임아웃(약 30초)을 넘겨 502가 난다.
        // 작게 잘라 요청 수를 늘리는 대신 요청 하나의 시간을 짧게 유지한다.
        const SEARCH_PAGE_SIZE = 30;
        // 검색 조건이 지나치게 넓을 때 무한정 조회하지 않도록 하는 안전장치
        const SEARCH_HARD_CAP = 3000;

        // 마지막 검색의 집계 정보 (총 상품수 / 제외 건수 표시에 사용)
        let searchMeta = { scanned: 0, cafe24Total: null, excludedStatus: 0, excludedRatio: 0, done: false };

        function resetSearchMeta() {
            searchMeta = { scanned: 0, cafe24Total: null, excludedStatus: 0, excludedRatio: 0, done: false };
        }

        // GET /api/products/search 호출 - 카페24 Admin API 기반 상품 검색
        // 카페24는 한 번에 최대 100건만 주므로 offset을 옮겨가며 끝까지 반복 조회한다.
        async function searchProducts() {
            const searchType = document.getElementById('searchType').value;
            const keyword = document.getElementById('searchInput').value.trim();
            const order = document.getElementById('sortOrder').value; // asc(등록순) | desc(등록역순)
            const maxScanRaw = document.getElementById('maxScan').value;
            const maxScan = maxScanRaw === 'all' ? SEARCH_HARD_CAP : parseInt(maxScanRaw, 10);

            if (!keyword) {
                alert('검색어를 입력해 주세요.');
                return;
            }

            const searchBtn = document.getElementById('searchBtn');
            searchBtn.disabled = true;
            searchBtn.classList.add('opacity-50', 'cursor-not-allowed');

            productsData = [];
            resetSearchMeta();
            renderProductTable();
            setProgress(0, 1, '상품 조회 중...');

            try {
                let offset = 0;

                while (true) {
                    const params = new URLSearchParams({
                        search_type: searchType,
                        keyword,
                        limit: SEARCH_PAGE_SIZE,
                        offset,
                        sort: 'created_date',
                        order
                    });
                    const res = await fetch(`/api/products/search?${params.toString()}`);

                    // 게이트웨이 타임아웃 등으로 JSON이 아닌 응답(HTML 에러 페이지)이
                    // 올 수 있으므로 파싱 실패를 따로 처리한다. 이미 모은 결과는 버리지 않는다.
                    let json;
                    try {
                        json = await res.json();
                    } catch (parseErr) {
                        alert(`서버 응답을 읽지 못했습니다 (offset=${offset}, HTTP ${res.status}).\n`
                            + `지금까지 조회된 ${productsData.length}건만 표시합니다.`);
                        break;
                    }

                    if (!res.ok || !json.success) {
                        const message = json.error || '상품 조회에 실패했습니다.';
                        if (json.reauth_required && json.reauth_url) {
                            if (confirm(`${message}\n\n지금 카페24 인증 페이지로 이동할까요?`)) {
                                window.open(json.reauth_url, '_blank', 'noopener,noreferrer');
                            }
                        } else {
                            alert(`${message}\n\n지금까지 조회된 ${productsData.length}건만 표시합니다.`);
                        }
                        break;
                    }

                    console.log(`[검색] offset=${offset} 소요 ${json.elapsed_seconds}초, `
                        + `조회 ${json.fetched_count}건 -> 표시 ${(json.data || []).length}건`);

                    // 전체 건수는 첫 페이지 응답에만 담겨 온다
                    if (json.total_count !== null && json.total_count !== undefined) {
                        searchMeta.cafe24Total = json.total_count;
                    }

                    productsData.push(...(json.data || []).map(p => ({
                        ...p,
                        images: buildImageList(p),
                        status: '조회 완료'
                    })));

                    searchMeta.scanned += json.fetched_count || 0;
                    searchMeta.excludedStatus += json.excluded_status_count || 0;
                    searchMeta.excludedRatio += json.excluded_ratio_count || 0;

                    // 페이지마다 즉시 화면에 반영해서 진행 상황이 보이게 한다
                    renderProductTable();
                    const totalForBar = searchMeta.cafe24Total || searchMeta.scanned;
                    setProgress(
                        Math.min(searchMeta.scanned, totalForBar),
                        totalForBar,
                        `상품 확인 중... (${searchMeta.scanned}/${searchMeta.cafe24Total ?? '?'}건 / 표시 대상 ${productsData.length}건)`
                    );

                    offset += SEARCH_PAGE_SIZE;

                    const reachedTotal = searchMeta.cafe24Total !== null && searchMeta.scanned >= searchMeta.cafe24Total;
                    if (!json.has_more || reachedTotal) break;

                    if (offset >= maxScan) {
                        alert(`조회 상한(${maxScan}건)에 도달해 중단했습니다. 검색 조건을 좁히거나 상한을 높여 주세요.`);
                        break;
                    }
                }

                searchMeta.done = true;
                renderProductTable();
                setProgress(1, 1, `상품 조회 완료 (${productsData.length}건 표시)`);
            } catch (e) {
                alert(`상품 조회 중 오류가 발생했습니다: ${e.message}`);
            } finally {
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // 상품의 대표이미지 + 추가이미지를 하나의 목록으로 만든다.
        // 각 이미지는 개별 체크박스를 가지며 기본값은 전부 체크된 상태다.
        function buildImageList(product) {
            const images = [{
                key: 'main',
                label: '대표',
                source_url: product.image_url,
                checked: true,
                preview_url: null,
                processed_filename: null,
                convert_error: null
            }];

            (product.add_images || []).forEach((url, idx) => {
                images.push({
                    key: `add_${idx}`,
                    label: `추가${idx + 1}`,
                    source_url: url,
                    checked: true,
                    preview_url: null,
                    processed_filename: null,
                    convert_error: null
                });
            });

            return images;
        }

        function getCheckedImages(product) {
            return (product.images || []).filter(img => img.checked);
        }

        // 체크되어 있고 변환까지 끝난 이미지 (송신/다운로드 대상)
        function getSendableImages(product) {
            return (product.images || []).filter(img => img.checked && img.processed_filename);
        }

        // ==========================================
        // 공통 유틸
        // ==========================================
        function getSelectedProducts() {
            const checkedNos = Array.from(document.querySelectorAll('.product-check:checked'))
                .map(cb => cb.dataset.productNo);
            return productsData.filter(p => checkedNos.includes(p.product_no));
        }

        function findProduct(productNo) {
            return productsData.find(p => p.product_no === productNo);
        }

        function setProgress(done, total, label) {
            const area = document.getElementById('progressArea');
            const bar = document.getElementById('progressBar');
            const percentEl = document.getElementById('progressPercent');
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;

            area.classList.remove('hidden');
            bar.style.width = pct + '%';
            percentEl.innerText = `${done} / ${total} (${pct}%)`;
            if (label) document.getElementById('stepStatus').innerText = label;
        }

        function setProductStatus(productNo, statusText) {
            const product = findProduct(productNo);
            if (product) product.status = statusText;
            const cell = document.getElementById(`status-cell-${productNo}`);
            if (cell) cell.innerHTML = statusBadge(statusText);
        }

        function statusBadge(statusText) {
            const styles = {
                '조회 완료': 'bg-slate-100 text-slate-500',
                '변환 중...': 'bg-amber-100 text-amber-700',
                '변환 완료': 'bg-emerald-100 text-emerald-700',
                '일부 변환 실패': 'bg-orange-100 text-orange-700',
                '변환 실패': 'bg-red-100 text-red-700',
                '송신 중...': 'bg-amber-100 text-amber-700',
                '송신 완료': 'bg-indigo-100 text-indigo-700',
                '송신 실패': 'bg-red-100 text-red-700'
            };
            const cls = styles[statusText] || 'bg-slate-100 text-slate-500';
            return `<span class="px-2 py-1 ${cls} rounded text-xs font-medium">${statusText}</span>`;
        }

        // 이미지 1장의 변환 결과 미리보기 칸만 갱신한다.
        // (renderPreviewBox가 캐시 무효화용 타임스탬프를 붙이므로 재변환 시에도 즉시 반영됨)
        function updatePreviewCell(productNo, img) {
            const cell = document.getElementById(`preview-${productNo}-${img.key}`);
            if (!cell) return;
            cell.innerHTML = renderPreviewBox(img);
        }

        // ==========================================
        // 테이블 렌더링
        // ==========================================
        // 총 상품수 / 제외 건수 안내를 항상 표에 붙여 렌더링한다.
        // (검색 함수에서 따로 갱신하면 렌더 시점과 어긋나거나, 요소를 못 찾았을 때
        //  예외가 나면서 안내가 통째로 사라질 수 있다)
        function renderSearchSummary() {
            const totalEl = document.getElementById('totalCount');
            const noteEl = document.getElementById('filterNote');
            if (totalEl) totalEl.innerText = productsData.length;
            if (!noteEl) return;

            if (searchMeta.scanned === 0) {
                noteEl.innerText = '';
                return;
            }

            const parts = [];
            if (searchMeta.cafe24Total !== null) {
                parts.push(`카페24 검색 ${searchMeta.cafe24Total}건 중 ${searchMeta.scanned}건 확인`);
            } else {
                parts.push(`${searchMeta.scanned}건 확인`);
            }
            if (searchMeta.excludedStatus > 0) {
                parts.push(`진열/판매/품절 제외 ${searchMeta.excludedStatus}건`);
            }
            if (searchMeta.excludedRatio > 0) {
                parts.push(`원본 비1:1 제외 ${searchMeta.excludedRatio}건`);
            }
            if (searchMeta.excludedStatus === 0 && searchMeta.excludedRatio === 0) {
                parts.push('제외 0건');
            }
            noteEl.innerText = `(${parts.join(' / ')})`;
        }

        function renderProductTable() {
            const tbody = document.getElementById('productTableBody');
            renderSearchSummary();

            if (productsData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="p-6 text-center text-sm text-slate-400">
                            상단 검색창에서 모델명을 입력 후 조회해 주세요
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = productsData.map((p, idx) => `
                <tr class="hover:bg-slate-50 align-top" id="row-${p.product_no}">
                    <td class="p-4 text-center">
                        <input type="checkbox" class="product-check w-4 h-4 rounded" data-product-no="${p.product_no}">
                    </td>
                    <td class="p-4 text-center font-mono text-xs text-slate-400">${idx + 1}</td>
                    <td class="p-4">
                        <div class="font-semibold text-slate-800">${p.product_name}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${p.product_code}</div>
                        <div class="text-[11px] text-slate-400 mt-1">
                            이미지 ${p.images.length}장 (추가 ${p.images.length - 1}장)
                        </div>
                    </td>
                    <td class="p-3">
                        <div class="flex flex-wrap gap-3">
                            ${p.images.map(img => renderImageCard(p, img)).join('')}
                        </div>
                    </td>
                    <td class="p-4 text-center" id="status-cell-${p.product_no}">${statusBadge(p.status)}</td>
                    <td class="p-4 text-center">
                        <button onclick="downloadProduct('${p.product_no}')"
                            class="px-2.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded text-xs font-semibold transition-colors">
                            ⬇️ 받기
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 이미지 1장 카드: 체크박스 + 라벨 + 원본 썸네일 + 변환 결과 미리보기
        function renderImageCard(product, img) {
            const cellId = `preview-${product.product_no}-${img.key}`;
            const isMain = img.key === 'main';
            const labelClass = isMain
                ? 'bg-indigo-100 text-indigo-700 border-indigo-200'
                : 'bg-slate-100 text-slate-600 border-slate-200';

            return `
                <div class="border ${img.checked ? 'border-slate-200' : 'border-dashed border-slate-300 opacity-50'} rounded-lg p-2 bg-white"
                     id="card-${product.product_no}-${img.key}">
                    <label class="flex items-center gap-1.5 cursor-pointer mb-1.5">
                        <input type="checkbox" class="image-check w-3.5 h-3.5 rounded"
                            data-product-no="${product.product_no}" data-key="${img.key}"
                            ${img.checked ? 'checked' : ''}
                            onchange="toggleImageChecked('${product.product_no}', '${img.key}', this.checked)">
                        <span class="px-1.5 py-0.5 border ${labelClass} rounded text-[10px] font-bold">${img.label}</span>
                    </label>
                    <div class="flex items-end gap-1">
                        <img src="${img.source_url}" alt="${img.label} 원본"
                            class="w-14 h-14 object-cover rounded border border-slate-200 bg-slate-100">
                        <span class="text-slate-300 text-xs pb-5">→</span>
                        <div id="${cellId}">${renderPreviewBox(img)}</div>
                    </div>
                </div>`;
        }

        function renderPreviewBox(img) {
            if (img.preview_url) {
                return `<img src="${img.preview_url}?t=${Date.now()}" alt="변환 결과"
                    class="w-14 h-[78.4px] object-cover rounded border border-indigo-200 bg-white">`;
            }
            if (img.convert_error) {
                return `<div class="w-14 h-[78.4px] bg-red-50 border border-red-200 rounded flex items-center justify-center text-[9px] text-red-500 text-center px-0.5">변환<br>실패</div>`;
            }
            return `<div class="w-14 h-[78.4px] bg-indigo-100/50 border border-indigo-200 rounded flex items-center justify-center text-[9px] text-indigo-400 font-mono">미변환</div>`;
        }

        // 이미지 체크 상태 변경 - 상태만 갱신하고 카드 테두리만 바꾼다 (전체 재렌더 방지)
        function toggleImageChecked(productNo, key, checked) {
            const product = findProduct(productNo);
            if (!product) return;

            const img = product.images.find(i => i.key === key);
            if (img) img.checked = checked;

            const card = document.getElementById(`card-${productNo}-${key}`);
            if (card) {
                card.classList.toggle('border-dashed', !checked);
                card.classList.toggle('border-slate-300', !checked);
                card.classList.toggle('opacity-50', !checked);
                card.classList.toggle('border-slate-200', checked);
            }
        }

        // ==========================================
        // 1단계: 변환실행 (POST /api/convert)
        // ==========================================
        async function runConvert() {
            const selected = getSelectedProducts();
            if (selected.length === 0) {
                alert('변환할 상품을 1건 이상 선택해 주세요.');
                return;
            }

            const mode = document.getElementById('processMode').value; // 'product' | 'model'
            const convertBtn = document.getElementById('convertBtn');
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let done = 0;
            setProgress(done, selected.length, '1단계: 썸네일 이미지 변환 중...');

            for (const product of selected) {
                // 체크된 이미지만 변환 대상. 체크 해제된 것은 서버로 보내지 않는다.
                const targetImages = getCheckedImages(product);
                if (targetImages.length === 0) {
                    setProductStatus(product.product_no, '변환 실패');
                    console.warn(`[변환 건너뜀] ${product.product_no}: 체크된 이미지가 없습니다.`);
                    done++;
                    setProgress(done, selected.length, '1단계: 썸네일 이미지 변환 중...');
                    continue;
                }

                setProductStatus(product.product_no, '변환 중...');
                try {
                    const res = await fetch('/api/convert', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            mode: mode,
                            products: [{
                                product_no: product.product_no,
                                images: targetImages.map(img => ({
                                    key: img.key,
                                    label: img.label,
                                    url: img.source_url
                                }))
                            }]
                        })
                    });
                    const json = await res.json();
                    const result = (json.data || [])[0];
                    const imageResults = (result && result.images) || [];

                    // 이미지별 결과를 각 카드에 반영
                    imageResults.forEach(r => {
                        const img = product.images.find(i => i.key === r.key);
                        if (!img) return;

                        if (r.status === 'SUCCESS') {
                            img.preview_url = r.preview_url;
                            img.processed_filename = r.processed_filename;
                            img.convert_error = null;
                        } else {
                            img.preview_url = null;
                            img.processed_filename = null;
                            img.convert_error = r.error || '변환 실패';
                            console.error(`[변환 실패] ${product.product_no} ${r.label}:`, r.error);
                        }
                        updatePreviewCell(product.product_no, img);
                    });

                    const failCount = (result && result.fail_count) || 0;
                    if (result && result.status === 'SUCCESS') {
                        setProductStatus(
                            product.product_no,
                            failCount > 0 ? '일부 변환 실패' : '변환 완료'
                        );
                    } else {
                        setProductStatus(product.product_no, '변환 실패');
                    }
                } catch (e) {
                    setProductStatus(product.product_no, '변환 실패');
                    console.error(`[변환 요청 오류] ${product.product_no}:`, e);
                }

                done++;
                setProgress(done, selected.length, '1단계: 썸네일 이미지 변환 중...');
            }

            setProgress(done, selected.length, '1단계: 변환 완료');
            convertBtn.disabled = false;
            convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // ==========================================
        // 2단계: 카페24로 송신 (POST /api/send-cafe24)
        // ==========================================
        async function runSendToCafe24() {
            const selected = getSelectedProducts();
            if (selected.length === 0) {
                alert('송신할 상품을 1건 이상 선택해 주세요.');
                return;
            }

            const targets = selected.filter(p => getSendableImages(p).length > 0);
            const skipped = selected.length - targets.length;
            if (targets.length === 0) {
                alert('선택한 상품에 송신할 변환 결과가 없습니다. 먼저 [1단계: 변환실행]을 진행해 주세요.');
                return;
            }
            if (skipped > 0) {
                alert(`변환된 이미지가 없는 ${skipped}건은 이번 송신에서 제외됩니다.`);
            }

            // 체크 해제된 추가이미지는 additional_image 배열에서 빠지므로 카페24에서 삭제된다.
            // 실수로 지우는 일이 없도록 송신 전에 반드시 확인받는다.
            const deletionCount = targets.reduce((sum, p) => {
                const addImages = (p.images || []).filter(i => i.key !== 'main');
                return sum + addImages.filter(i => !i.checked).length;
            }, 0);

            if (deletionCount > 0) {
                const ok = confirm(
                    `선택 해제된 추가이미지 ${deletionCount}개는 카페24에서 삭제됩니다. 계속하시겠습니까?`
                );
                if (!ok) return;
            }

            await sendItemsToCafe24(targets);
        }

        // 송신 요청 1건 구성.
        // - 대표이미지가 체크 해제되면 main_filename을 보내지 않아 기존 값이 유지된다.
        // - has_additional_images는 "상품이 원래 추가이미지를 가지고 있는지"다. false면
        //   서버가 additional_image 필드 자체를 보내지 않아 실수로 지우는 일을 막는다.
        function buildSendItem(product) {
            const images = product.images || [];
            const mainImage = images.find(i => i.key === 'main');
            const addImages = images.filter(i => i.key !== 'main');

            return {
                product_no: product.product_no,
                main_filename: (mainImage && mainImage.checked) ? mainImage.processed_filename : null,
                add_filenames: addImages
                    .filter(i => i.checked && i.processed_filename)
                    .map(i => i.processed_filename),
                has_additional_images: addImages.length > 0
            };
        }

        async function sendItemsToCafe24(targets) {
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let done = 0;
            const failures = [];
            setProgress(done, targets.length, '2단계: 카페24로 이미지 송신 중...');

            for (const product of targets) {
                setProductStatus(product.product_no, '송신 중...');
                try {
                    const res = await fetch('/api/send-cafe24', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            items: [buildSendItem(product)]
                        })
                    });
                    const json = await res.json();
                    const itemFailure = (json.failures || [])[0];

                    if (itemFailure) {
                        setProductStatus(product.product_no, '송신 실패');
                        failures.push({
                            product_no: product.product_no,
                            product_name: product.product_name,
                            product_code: product.product_code,
                            reason: itemFailure.reason || '알 수 없는 오류'
                        });
                    } else {
                        setProductStatus(product.product_no, '송신 완료');
                    }
                } catch (e) {
                    setProductStatus(product.product_no, '송신 실패');
                    failures.push({
                        product_no: product.product_no,
                        product_name: product.product_name,
                        product_code: product.product_code,
                        reason: e.message || '네트워크 오류'
                    });
                }

                done++;
                setProgress(done, targets.length, '2단계: 카페24로 이미지 송신 중...');
            }

            setProgress(done, targets.length, '2단계: 송신 완료');
            sendBtn.disabled = false;
            sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            renderFailureArea(failures);
        }

        // ==========================================
        // 변환 결과 다운로드 (POST /api/download -> ZIP)
        // ==========================================
        // 체크되어 있고 변환까지 끝난 이미지만 ZIP에 담는다 (라벨을 파일명에 씀)
        function toDownloadItem(product) {
            return {
                product_code: product.product_code || product.product_no,
                product_no: product.product_no,
                images: getSendableImages(product).map(img => ({
                    label: img.label,
                    filename: img.processed_filename
                }))
            };
        }

        async function downloadItems(items) {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items })
                });

                if (!res.ok) {
                    // 실패 시에는 JSON 에러 본문이 내려온다
                    let message = '다운로드에 실패했습니다.';
                    try {
                        const json = await res.json();
                        message = json.error || message;
                    } catch (e) { /* 본문이 JSON이 아니면 기본 메시지 사용 */ }
                    alert(message);
                    return;
                }

                // 응답(ZIP)을 blob으로 받아 브라우저 다운로드를 트리거한다
                const blob = await res.blob();
                const disposition = res.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
                const fileName = match ? decodeURIComponent(match[1]) : 'thumbnails.zip';

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert(`다운로드 중 오류가 발생했습니다: ${e.message}`);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // 표의 행별 "받기" 버튼 - 해당 상품 1건만 다운로드
        async function downloadProduct(productNo) {
            const product = findProduct(productNo);
            if (!product) return;

            if (getSendableImages(product).length === 0) {
                alert('체크된 이미지 중 변환된 것이 없습니다. 먼저 [1단계: 변환실행]을 진행해 주세요.');
                return;
            }
            await downloadItems([toDownloadItem(product)]);
        }

        // 상단 "다운로드" 버튼 - 선택된 상품 전체를 ZIP으로 다운로드
        async function downloadSelected() {
            const selected = getSelectedProducts();
            if (selected.length === 0) {
                alert('다운로드할 상품을 1건 이상 선택해 주세요.');
                return;
            }

            const targets = selected.filter(p => getSendableImages(p).length > 0);
            const skipped = selected.length - targets.length;
            if (targets.length === 0) {
                alert('선택한 상품에 변환된 이미지가 없습니다. 먼저 [1단계: 변환실행]을 진행해 주세요.');
                return;
            }
            if (skipped > 0) {
                alert(`변환된 이미지가 없는 ${skipped}건은 이번 다운로드에서 제외됩니다.`);
            }

            await downloadItems(targets.map(toDownloadItem));
        }

        // ==========================================
        // 실패 상품 리스트 (#failureArea)
        // ==========================================
        let lastFailures = [];

        function renderFailureArea(failures) {
            lastFailures = failures;
            const area = document.getElementById('failureArea');
            const tbody = document.getElementById('failTableBody');
            const countEl = document.getElementById('failCount');

            if (!failures || failures.length === 0) {
                area.classList.add('hidden');
                tbody.innerHTML = '';
                countEl.innerText = '0';
                return;
            }

            countEl.innerText = failures.length;
            tbody.innerHTML = failures.map(f => `
                <tr>
                    <td class="p-3 text-center"><input type="checkbox" checked class="fail-check" data-product-no="${f.product_no}"></td>
                    <td class="p-3 font-mono">${f.product_code}</td>
                    <td class="p-3">${f.product_name}</td>
                    <td class="p-3 text-red-600">${f.reason}</td>
                </tr>
            `).join('');
            area.classList.remove('hidden');
        }

        async function retryFailed() {
            if (lastFailures.length === 0) return;

            const checkedNos = Array.from(document.querySelectorAll('.fail-check:checked'))
                .map(cb => cb.dataset.productNo);
            const retryTargets = productsData.filter(
                p => checkedNos.includes(p.product_no) && getSendableImages(p).length > 0
            );

            if (retryTargets.length === 0) {
                alert('재송신할 상품을 선택해 주세요.');
                return;
            }

            await sendItemsToCafe24(retryTargets);
        }

        // 초기 진입 시 빈 상태(검색 안내 문구) 렌더링
        renderProductTable();
    </script>
</body>
</html>
